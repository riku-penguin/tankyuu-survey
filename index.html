<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>探究アンケート</title>
  <style>
    body {
      background: #f5f7ff;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .screenBox {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 30px;
      width: 90%;
      max-width: 600px;
      margin: 40px auto;
      box-sizing: border-box;
    }

    /* プレ画面 */
    #preSituationScreen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    #preSituationText {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    #preCountdown {
      font-size: 18px;
      margin-top: 10px;
      color: #555;
    }

    #preQuestionNumber {
      font-size: 18px;
      margin-top: 10px;
      color: #777;
    }

    #preOkBtn {
      margin-top: 40px;
      width: 240px;
    }

    .primaryButton {
      background: #8bcf9b;
      border-radius: 14px;
      padding: 14px 20px;
      border: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
      cursor: pointer;
    }

    .primaryButton:hover {
      background: #7ac88f;
    }

    /* 質問画面 */
    #playerContainer {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    #questionNumber {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    #playerSituation {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #playerQuestion {
      font-size: 20px;
      margin-bottom: 20px;
    }

    #timerText {
      font-size: 18px;
      margin-bottom: 10px;
      color: #444;
    }

    #timerBar {
      height: 12px;
      background: #8bc34a;
      border-radius: 6px;
      margin-bottom: 20px;
      width: 100%;
      transition: width 0.1s linear;
    }

    .optionButton {
      background: #eef7ff;
      border-radius: 12px;
      border: 1px solid #d0e4ff;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .optionButton:hover {
      background: #e0f0ff;
    }

    .selectedOption {
      background: #cfe8ff !important;
      border-color: #7bb4ff !important;
    }

    .optionImagePlaceholder {
      width: 100%;
      height: 120px;
      background: #f0f4ff;
      border: 1px dashed #bcd0ff;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a8bbd;
      font-size: 16px;
    }

    /* 結果画面 */
    #finalScreen {
      display: none;
      overflow-y: auto;
      max-height: 90vh;
    }

    #resultType {
      margin-top: 30px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #4a6fdc;
    }

    #typeDetailBox {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .typeDescriptionBox {
      margin-top: 20px;
      padding: 20px;
      background: #f0f8ff;
      border-left: 6px solid #4aa3ff;
      border-radius: 8px;
      font-size: 1.15em;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }

    .typeDescriptionBox.show {
      opacity: 1;
      transform: translateY(0);
    }

    #resultTable {
      margin: 20px auto;
      width: 90%;
      max-width: 500px;
      border-collapse: collapse;
      font-size: 18px;
    }

    #resultTable th {
      border-bottom: 2px solid #ccc;
      padding: 12px;
    }

    #resultTable td {
      border-bottom: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

  </style>
</head>
<body>

  <!-- 開始画面 -->
  <div id="startScreen" class="screenBox">
    <h2>探究アンケート</h2>
    <p>性別と年齢を入力して、アンケートを始めてください。</p>

    <label>性別：
      <select id="playerGender">
        <option value="">選択してください</option>
        <option value="male">男性</option>
        <option value="female">女性</option>
        <option value="other">その他</option>
      </select>
    </label>

    <br><br>

    <label>年齢：
      <input type="number" id="playerAge" min="10" max="100">
    </label>

    <br><br>

    <button id="startBtn" class="primaryButton">はじめる</button>
  </div>

  <!-- プレ画面 -->
  <div id="preSituationScreen" class="screenBox">
    <div id="preQuestionNumber"></div>
    <div id="preSituationText"></div>
    <div id="preCountdown"></div>
    <button id="preOkBtn" class="primaryButton">OK</button>
  </div>

  <!-- 質問画面 -->
  <div id="playerContainer" class="screenBox">
    <div id="questionNumber"></div>
    <div id="playerSituation"></div>
    <div id="playerQuestion"></div>

    <div id="timerText"></div>
    <div id="timerBar"></div>

    <div id="playerOptions"></div>

    <button id="confirmBtn" class="primaryButton" style="display:none;">この選択肢で決定</button>
  </div>

  <!-- 一巡目終了 -->
  <div id="infoScreen" class="screenBox" style="display:none;">
    <h2>一巡目が終了しました</h2>
    <p>二巡目ではゆっくり考えて選べます。</p>
    <button id="startSecondRoundBtn" class="primaryButton">二巡目をはじめる</button>
  </div>

  <!-- 二巡目説明 -->
  <div id="secondRoundInfo" class="screenBox" style="display:none;">
    <h2>二巡目について</h2>
    <p>時間切れはありません。じっくり考えてください。</p>
    <button id="secondRoundOkBtn" class="primaryButton">二巡目をはじめる</button>
  </div>

  <!-- 結果画面 -->
  <div id="finalScreen" class="screenBox">
    <h2 id="resultType"></h2>
    <div id="typeDetailBox"></div>

    <h3 style="text-align:center;">あなたの傾向まとめ</h3>
    <table id="resultTable">
      <tr><th>項目</th><th>あなたの数値</th></tr>
    </table>

    <button id="shareBigBtn" class="primaryButton">結果を共有する</button>
  </div>

  <script src="player.js"></script>
</body>
</html>
