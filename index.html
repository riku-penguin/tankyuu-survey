<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>アンケートプレイヤー</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="startScreen">
  <h2>アンケート開始</h2>
  <label>性別：</label>
  <input id="playerGender" type="text" />

  <label>年齢：</label>
  <input id="playerAge" type="number" />

  <button id="startBtn">開始する</button>
</div>

<div id="playerContainer" style="display:none;">
  <div id="questionNumber"></div>

  <div id="timerBox">
    <div id="timerText">残り時間: -- 秒</div>
    <div id="timerBar"></div>
  </div>

  <div id="playerSituation"></div>
  <div id="playerQuestion"></div>
  <div id="playerOptions"></div>
</div>

<div id="infoScreen" style="display:none;">
  <h2>1巡目が終了しました</h2>
  <button id="startSecondRoundBtn">2巡目を開始する</button>
</div>

<div id="finalScreen" style="display:none;">
  <h2>アンケート終了！</h2>
  <button id="copyShareLinkBtn">共有リンクをコピー</button>
</div>

<script src="player.js"></script>
</body>
</html>
