<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>探究アンケート</title>
  <style>

    /* 結果画面全体をスクロール可能に */
#finalScreen {
  overflow-y: auto;
  max-height: 90vh;
}

/* タイプ説明文のアニメーション */
.typeDescriptionBox {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
}

.typeDescriptionBox.show {
  opacity: 1;
  transform: translateY(0);
}

/* 説明文スクロール領域 */
#typeDetailBox {
  max-height: 250px;
  overflow-y: auto;
}

    /* スクロール誘導メッセージ */
#finalScreen::after {
  content: "↓ スクロールすると詳しいタイプ説明が見られます";
  display: block;
  text-align: center;
  margin-top: 10px;
  color: #555;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* タイプ説明カード */
.typeDescriptionBox {
  margin-top: 30px;
  padding: 20px;
  background: #f0f8ff;
  border-left: 6px solid #4aa3ff;
  border-radius: 8px;
  font-size: 1.15em;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s ease;
}

/* 表示アニメーション */
.typeDescriptionBox.show {
  opacity: 1;
  transform: translateY(0);
}

/* スクロール誘導メッセージ */
#finalScreen::after {
  content: "↓ スクロールすると詳しいタイプ説明が見られます";
  display: block;
  text-align: center;
  margin-top: 10px;
  color: #555;
  animation: blink 1.5s infinite;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* タイプ説明カード */
.typeDescriptionBox {
  margin-top: 30px;
  padding: 20px;
  background: #f0f8ff;
  border-left: 6px solid #4aa3ff;
  border-radius: 8px;
  font-size: 1.15em;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s ease;
}

/* 表示アニメーション */
.typeDescriptionBox.show {
  opacity: 1;
  transform: translateY(0);
}

    body {
      background: #f5f7ff;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .screenBox {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 30px;
      width: 90%;
      max-width: 600px;
      margin: 40px auto;
      box-sizing: border-box;
    }

    /* プレ画面だけ縦横中央に */
    #preSituationScreen {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    #preSituationText {
      font-size: 22px;
      font-weight: bold;
      margin-top: 40px;
      color: #333;
    }

    #preSituationScreen #preOkBtn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      font-size: 20px;
      z-index: 20;
    }

    /* 質問画面の決定ボタンは通常位置 */
    #confirmBtn {
      position: static;
      margin-top: 20px;
    }

    .primaryButton {
      background: #8bcf9b;
      border-radius: 14px;
      padding: 14px 20px;
      border: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
      cursor: pointer;
    }

    .primaryButton:hover {
      background: #7ac88f;
    }

    #playerContainer {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: flex-start;
    }

    #questionNumber {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }

    .optionButton {
      background: #eef7ff;
      border-radius: 12px;
      border: 1px solid #d0e4ff;
      padding: 14px;
      margin-bottom: 12px;
      transition: 0.2s;
      font-size: 18px;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .optionButton:hover {
      background: #e0f0ff;
    }

    .selectedOption {
      background: #cfe8ff !important;
      border-color: #7bb4ff !important;
    }

    #timerBar {
      height: 12px;
      border-radius: 6px;
      transition: width 0.1s linear;
      background: #8bc34a;
      margin-top: 8px;
    }

    .optionImagePlaceholder {
      width: 100%;
      height: 120px;
      background: #f0f4ff;
      border: 1px dashed #bcd0ff;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a8bbd;
      font-size: 16px;
    }

    #resultType {
      margin-top: 30px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #4a6fdc;
    }

    #resultTable {
      margin: 30px auto;
      width: 90%;
      max-width: 500px;
      border-collapse: collapse;
      font-size: 18px;
    }

    #resultTable th {
      border-bottom: 2px solid #ccc;
      padding: 12px;
    }

    #resultTable td {
      border-bottom: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    #shareBigBtn {
      margin: 40px auto;
      display: block;
      width: 260px;
      font-size: 22px;
      background: #6aa8ff;
    }

    #shareBigBtn:hover {
      background: #5b9af0;
    }
  </style>
</head>
<body>

  <!-- 開始画面 -->
  <div id="startScreen" class="screenBox">
    <h2>探究アンケート</h2>
    <p>性別と年齢を入力して、アンケートを始めてください。</p>

    <div style="margin-top:20px;">
      <label>性別：
        <select id="playerGender">
          <option value="">選択してください</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
          <option value="other">その他</option>
        </select>
      </label>
    </div>

    <div style="margin-top:10px;">
      <label>年齢：
        <input type="number" id="playerAge" min="10" max="100">
      </label>
    </div>

    <button id="startBtn" class="primaryButton" style="margin-top:20px;">はじめる</button>
  </div>

  <!-- プレ画面 -->
  <div id="preSituationScreen" class="screenBox">
    <div id="preCountdown"></div>
    <div id="preQuestionNumber"></div>
    <div id="preSituationText"></div>
    <button id="preOkBtn" class="primaryButton">OK</button>
  </div>

  <!-- 質問画面 -->
  <div id="playerContainer" class="screenBox">
    <div id="questionNumber"></div>
    <div id="playerSituation"></div>
    <div id="playerQuestion"></div>

    <div id="timerText"></div>
    <div id="timerBar"></div>

    <div id="playerOptions"></div>

    <button id="confirmBtn" class="primaryButton">この選択肢で決定</button>
  </div>

  <!-- 一巡目終了後 -->
  <div id="infoScreen" class="screenBox" style="display:none;">
    <h2>一巡目が終了しました</h2>
    <p>
      二巡目では、少しゆっくり考えてから選べるようになります。<br>
      時間切れはないので、じっくり考えてください！
    </p>
    <button id="startSecondRoundBtn" class="primaryButton">二巡目をはじめる</button>
  </div>

  <!-- 二巡目説明 -->
  <div id="secondRoundInfo" class="screenBox" style="display:none;">
    <h2>二巡目について</h2>
    <p>
      二巡目では、少しゆっくり考えてから選べるようになります。<br>
      時間切れはないので、じっくり考えてください！
    </p>
    <button id="secondRoundOkBtn" class="primaryButton">二巡目をはじめる</button>
  </div>

<!-- ▼▼▼ 終了画面（最適化済み） ▼▼▼ -->
<div id="finalScreen" class="screenBox" style="display:none; overflow-y:auto; max-height:90vh;">

  <div style="text-align:center; font-size:18px; line-height:1.6;">
    最後まで回答していただきありがとうございました！<br>
    今後の探究活動の参考にさせていただきます。<br>
    もしよろしければ、<br>
    <b>このアンケートをほかの人にも伝えていただけると嬉しいです。</b>
  </div>

  <!-- タイプ画像（任意） -->
  <div id="typeImagePlaceholder"
       style="width: 100%; max-width: 300px; height: 180px; 
              background: #f0f4ff; border: 1px dashed #bcd0ff;
              border-radius: 16px; margin: 20px auto;
              display: flex; align-items: center; justify-content: center;
              color: #7a8bbd; font-size: 16px;">
    （ここにタイプの画像が入ります）
  </div>

  <!-- タイプ名 -->
  <h2 id="resultType" style="text-align:center; font-size:26px; color:#4a6fdc; margin-top:10px;"></h2>

  <!-- 説明文スクロール領域 -->
  <div id="typeDetailBox"
       style="max-height:250px; overflow-y:auto; padding:15px; 
              background:#f0f8ff; border-left:6px solid #4aa3ff;
              border-radius:10px; margin:20px 0;">
    <!-- JS がここに説明文を入れる -->
  </div>

  <h3 style="text-align:center; margin-top:10px;">あなたの傾向まとめ</h3>

  <table id="resultTable" style="margin:20px auto; width:90%; max-width:500px; border-collapse:collapse;">
    <tr><th>項目</th><th>あなたの数値</th></tr>
  </table>

  <button id="shareBigBtn" class="primaryButton" style="margin:30px auto; display:block; width:260px; font-size:22px;">
    結果を共有する
  </button>

</div>
